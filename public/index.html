<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTI Shift Reports</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;1,500;1,700;1,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img class="brand-logo" src="/pti-logo.png" alt="Petrol Transport, Inc. — Bakersfield, California"></div>
    <nav class="nav" aria-label="Reports">
      <button type="button" data-view="overview">Overview</button>
      <h2>Timesheet check</h2>
      <button type="button" data-view="eld">Shift hours (ELD)</button>
      <button type="button" data-view="eldday">Hours by driver and day</button>
      <button type="button" data-view="tscheck">Compare to timesheets</button>
      <h2>Reports</h2>
      <button type="button" data-view="shifts">Shifts</button>
      <button type="button" data-view="stops">Stops</button>
      <button type="button" data-view="daily">Hours by day</button>
      <button type="button" data-view="totals">Driver totals</button>
      <h2>Analysis</h2>
      <button type="button" data-view="sites">Time on site</button>
      <button type="button" data-view="lanes">Point to point</button>
      <button type="button" data-view="compare">Compare two locations</button>
      <h2>Compliance</h2>
      <button type="button" data-view="hos">80-hour clock</button>
      <h2>Maintenance</h2>
      <button type="button" data-view="faults">Fault history</button>
      <h2>Setup</h2>
      <button type="button" data-view="check">Connection check</button>
      <button type="button" data-view="rules">How numbers are worked out</button>
    </nav>
    <div class="side-foot">
      <div><span class="dot" id="dot"></span><span id="mode">Connecting</span></div>
      <form method="post" action="/logout" id="logout" hidden><button type="submit">Sign out</button></form>
    </div>
  </aside>

  <div class="main">
    <div class="banner">
      <svg class="art" viewBox="0 0 1200 96" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <polygon points="40,0 110,0 20,96 -50,96" fill="#e0232e" opacity=".85"/><polygon points="120,0 138,0 48,96 30,96" fill="#1f7bff" opacity=".8"/>
        <polygon points="1010,96 1080,0 1100,0 1030,96" fill="#1f7bff" opacity=".35"/><polygon points="1045,96 1115,0 1125,0 1055,96" fill="#e0232e" opacity=".5"/>
        <g fill="#03102a" opacity=".85">
          <rect x="250" y="62" width="34" height="34"/><rect x="290" y="54" width="40" height="42"/><rect x="336" y="66" width="30" height="30"/>
          <path d="M395 96 L410 44 L418 44 L433 96 Z"/><rect x="372" y="36" width="92" height="7" transform="rotate(-9 418 40)"/><path d="M452 22 q16 8 10 30 l-10 -2 z"/><rect x="368" y="46" width="6" height="50"/><rect x="386" y="84" width="60" height="12"/>
          <rect x="520" y="40" width="70" height="56" rx="3"/><rect x="514" y="36" width="82" height="6"/><rect x="600" y="52" width="54" height="44" rx="3"/><rect x="660" y="60" width="40" height="36" rx="3"/>
          <rect x="708" y="30" width="5" height="66"/><rect x="722" y="46" width="5" height="50"/><rect x="740" y="68" width="60" height="28"/><rect x="0" y="92" width="1200" height="4"/>
        </g>
      </svg>
      <div class="t"><b>Shift Reports</b><span>Fleet Operations &amp; Field Activity</span></div>
    </div>
    <div class="bar" id="bar">
      <label class="field">Period
        <select id="preset">
          <option value="7">Last 7 days</option><option value="14" selected>Last 14 days</option><option value="28">Last 28 days</option>
          <option value="month">This month</option><option value="lastmonth">Last month</option><option value="custom">Custom dates</option>
        </select>
      </label>
      <label class="field">From<input type="date" id="start"></label>
      <label class="field">To<input type="date" id="end"></label>
      <button type="button" class="btn primary" id="run">Run report</button>
      <span class="grow"></span>
      <label class="field">Driver<select id="f-driver"><option value="">All drivers</option></select></label>
      <label class="field">Truck<select id="f-truck"><option value="">All trucks</option></select></label>
      <label class="field">Start yard<select id="f-yard"><option value="">All yards</option></select></label>
      <label class="check"><input type="checkbox" id="f-flag"> Over a limit only</label>
    </div>

    <main class="content">
      <div class="pagehead"><h1 id="title">Overview</h1><p id="period"></p></div>
      <div class="notice" id="notice" hidden></div>
      <div id="view"></div>
    </main>
  </div>
</div>
<div id="drawer-root"></div>
<script src="/core.js"></script>
<script src="/timesheet.js"></script>
<script src="/app.js"></script>
</body>
</html>
