<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | PTI Shift Reports</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;1,500;1,700;1,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="gate">
  <div class="left">
    <div><img class="brand-logo" src="/pti-logo.png" alt="Petrol Transport, Inc. — Bakersfield, California"></div>
    <div>
      <div class="strip big" aria-hidden="true"><i class="d" style="left:0;width:14%"></i><i class="s" style="left:14%;width:9%"></i><i class="d" style="left:23%;width:22%"></i><i class="s" style="left:45%;width:11%"></i><i class="d" style="left:56%;width:19%"></i><i class="s" style="left:75%;width:7%"></i><i class="d" style="left:82%;width:10%"></i></div>
      <p>Shifts, stops and hours for every driver, yard to yard.</p>
    </div>
  </div>
  <div class="right">
    <form method="post" action="/login">
      <h1>Sign in</h1>
      <div class="notice bad" id="err" hidden></div>
      <label class="field" for="password">Office password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
</div>
<script>
  var e = new URLSearchParams(location.search).get('e'), box = document.getElementById('err');
  if (e) { box.hidden = false; box.textContent = e === 'wait' ? 'Too many tries. Wait 15 minutes, then try again.' : 'That password is not right. Try again.'; }
</script>
</body>
</html>
